        function loadLocalState() {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state.students = parsed.students || [];
                    state.staff = parsed.staff || [];
                    state.notices = parsed.notices || [];
                    state.resources = parsed.resources || [];
                    state.gallery = parsed.gallery || [];
                    state.messages = parsed.messages || [];
                    if (parsed.publishSettings) state.publishSettings = parsed.publishSettings;
                    if (parsed.adminAccounts) state.adminAccounts = { ...state.adminAccounts, ...parsed.adminAccounts };
                    if (parsed.schoolSettings) state.schoolSettings = { ...state.schoolSettings, ...parsed.schoolSettings };
                    return;
                }
            } catch (e) {
                console.warn('LocalStorage load failed, initializing seed data:', e);
            }
            const seed = getSeedData();
            state.students = seed.students;
            state.staff = seed.staff;
            state.notices = seed.notices;
            state.resources = seed.resources;
            state.gallery = seed.gallery;
            state.messages = seed.messages;
            saveLocalState();
        }

        function saveLocalState() {
            if (state.dbMode !== 'local') return;
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
                    students: state.students,
                    staff: state.staff,
                    notices: state.notices,
                    resources: state.resources,
                    gallery: state.gallery,
                    messages: state.messages,
                    publishSettings: state.publishSettings,
                    schoolSettings: state.schoolSettings,
                    adminAccounts: state.adminAccounts
                }));
            } catch (e) {
                console.warn('LocalStorage save error:', e);
                showToast(state.lang === 'am' ? 'የብራውዘሩ ማስቀመጫ (Storage) ሞልቷል!' : 'Browser storage limit reached!', 'error');
            }
        }

        function attachRealtimeListeners() {
            if (!currentUser) return;

            const onErr = (name) => (err) => console.error(`Snapshot error (${name}):`, err);

            onSnapshot(pubCol('students'), (snap) => {
                state.students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentView();
            }, onErr('students'));

            onSnapshot(pubCol('staff'), (snap) => {
                state.staff = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentView();
            }, onErr('staff'));

            onSnapshot(pubCol('notices'), (snap) => {
                state.notices = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            }, onErr('notices'));

                    };
                }
            }, onErr('adminAccounts'));
        }

        async function dbSave(colName, id, data) {
            if (state.dbMode === 'firebase') {
                if (!currentUser) return;
                if (id) {
                    await setDoc(pubDoc(colName, id), { ...data, id }, { merge: true });
                } else {
                    const ref = await addDoc(pubCol(colName), data);
                    await updateDoc(ref, { id: ref.id });
                }
            } else {
                const targetId = id || `${colName}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
                const list = state[colName];
                const idx = list.findIndex(x => x.id === targetId);
                const record = { ...data, id: targetId };
                if (idx >= 0) list[idx] = record;
                else list.unshift(record);
                saveLocalState();
                renderCurrentView();
            }
        }

        async function dbDelete(colName, id) {
            if (state.dbMode === 'firebase') {
                if (!currentUser) return;
                await deleteDoc(pubDoc(colName, id));
            } else {
                state[colName] = state[colName].filter(x => x.id !== id);
                saveLocalState();
                renderCurrentView();
            }
        }

        async function dbSaveConfig(docId, data) {
            if (state.dbMode === 'firebase') {
                if (!currentUser) return;
                await setDoc(pubDoc('config', docId), data, { merge: true });
            } else {
                state[docId] = { ...state[docId], ...data };
                saveLocalState();
                updateChromeInfo();
                renderCurrentView();
            }
        }

        // Compress uploaded images via Canvas (mime lets logos stay PNG with transparency)
        function compressImageFile(file, maxWidth = 820, quality = 0.72, mime = 'image/jpeg') {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL(mime, quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function computeStudentRank(student) {
            const peers = state.students.filter(
                s => Number(s.grade) === Number(student.grade)
                    && String(s.section).toUpperCase() === String(student.section).toUpperCase()
                    && Number(s.semester) === Number(student.semester)
            );
            const studentTotal = Number(student.total || 0);
            const higherCount = peers.filter(p => Number(p.total || 0) > studentTotal).length;
            return { rank: higherCount + 1, totalPeers: peers.length };
        }

        function getScoreRemark(score) {
            const n = Number(score);
            if (n >= 90) return state.lang === 'am' ? 'እጅግ በጣም ጥሩ (A)' : 'Excellent (A)';
            if (n >= 80) return state.lang === 'am' ? 'በጣም ጥሩ (B)' : 'Very Good (B)';
            if (n >= 65) return state.lang === 'am' ? 'ጥሩ (C)' : 'Good (C)';
            if (n >= 50) return state.lang === 'am' ? 'አጥጋቢ (D)' : 'Satisfactory (D)';
            return state.lang === 'am' ? 'ዝቅተኛ (F)' : 'Needs Improvement (F)';
        }

                <li>📍 ${escapeHtml(state.lang === 'am' ? state.schoolSettings.addressAm : state.schoolSettings.addressEn)}</li>

                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            updateDbBadge();

            const navItems = [
                { id: 'home', label: t('nav_home') },
                { id: 'about', label: t('nav_about') },
                { id: 'staff', label: t('nav_staff') },
                { id: 'notices', label: t('nav_notices') },
                { id: 'resources', label: t('nav_resources') },
                { id: 'gallery', label: t('nav_gallery') },
                { id: 'contact', label: t('nav_contact') }
            ];

            document.getElementById('desktop-nav').innerHTML = navItems.map(item => `
                <button onclick="navigateTo('${item.id}')" class="px-3 py-2 rounded-xl transition ${state.route === item.id ? 'bg-royal-50 text-royal-900 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-royal-900'}">

        window.toggleLanguage = () => {
            state.lang = state.lang === 'am' ? 'en' : 'am';

            renderAll();
        };

        window.navigateTo = (route) => {
            state.route = route;
            if (route !== 'results') {
                state.resultLookup.error = '';
            }
            updateChromeInfo();
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.toggleMobileMenu = () => {
            const menu = document.getElementById('mobile-menu');
            const openIcon = document.getElementById('menu-icon-open');
            const closeIcon = document.getElementById('menu-icon-close');
            const isHidden = menu.classList.contains('hidden');
            menu.classList.toggle('hidden', !isHidden);
            openIcon.classList.toggle('hidden', isHidden);
            closeIcon.classList.toggle('hidden', !isHidden);
        };

        window.closeMobileMenu = () => {
            document.getElementById('mobile-menu').classList.add('hidden');
            document.getElementById('menu-icon-open').classList.remove('hidden');
            document.getElementById('menu-icon-close').classList.add('hidden');
        };

        function renderAll() {
            updateChromeInfo();
            renderCurrentView();
        }

        function renderCurrentView() {
            const activeEl = document.activeElement;
            const activeId = activeEl && activeEl.id ? activeEl.id : null;
            const selStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
            const selEnd = activeEl && typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null;

            const main = document.getElementById('app-main');
            switch (state.route) {
                case 'home': main.innerHTML = renderHomeView(); break;
                case 'about': main.innerHTML = renderAboutView(); break;
                case 'staff': main.innerHTML = renderStaffView(); break;
                case 'notices': main.innerHTML = renderNoticesView(); break;
                case 'resources': main.innerHTML = renderResourcesView(); break;
                case 'gallery': main.innerHTML = renderGalleryView(); break;
                case 'contact': main.innerHTML = renderContactView(); break;
                case 'results': main.innerHTML = renderResultsView(); break;
                case 'admin': main.innerHTML = renderAdminView(); break;
                default: main.innerHTML = renderHomeView();
            }

            if (activeId) {
                const restored = document.getElementById(activeId);
                if (restored) {
                    restored.focus();
                    if (selStart !== null && typeof restored.setSelectionRange === 'function') {
                        try { restored.setSelectionRange(selStart, selEnd); } catch (_) {}
                    }
                }
            }
        }

        function renderStaffView() {
            const q = state.staffFilter.search.trim().toLowerCase();
            const cat = state.staffFilter.category;

            const filtered = state.staff.filter(s => {
                const matchCat = cat === 'all' || s.roleCategory === cat;
                const matchSearch = !q ||
                    (s.fullName || '').toLowerCase().includes(q) ||
                    (s.position || '').toLowerCase().includes(q) ||
                    (s.subjectOrDept || '').toLowerCase().includes(q);
                return matchCat && matchSearch;
            });

            const categories = [
                { key: 'leadership', label: t('cat_leadership'), badge: 'bg-amber-100 text-amber-800', icon: '🏛️' },
                { key: 'teachers', label: t('cat_teachers'), badge: 'bg-blue-100 text-royal-900', icon: '👨‍🏫' },
                { key: 'support', label: t('cat_support'), badge: 'bg-emerald-100 text-emerald-800', icon: '🛡️' }
            ];

            return `
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 fade-in">
                <div class="mb-6">
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-royal-900">${escapeHtml(t('staff_title'))}</h1>
                    <p class="text-slate-600 text-sm mt-1">${escapeHtml(t('staff_subtitle'))}</p>
                </div>

                <div class="bg-blue-50 border border-blue-200 text-royal-900 rounded-2xl p-4 mb-6 flex items-start gap-3 text-xs sm:text-sm">

                    <p class="font-medium">${escapeHtml(t('privacy_note'))}</p>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">

                        <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <input id="staff-search-input" type="text" value="${escapeHtml(state.staffFilter.search)}" oninput="updateStaffFilter('search', this.value)" placeholder="${escapeHtml(t('search_staff_placeholder'))}" class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-royal-600 focus:border-royal-600 outline-none text-sm" />
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="updateStaffFilter('category', 'all')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${cat === 'all' ? 'bg-royal-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">${escapeHtml(t('cat_all'))}</button>
                        ${categories.map(c => `
                            <button onclick="updateStaffFilter('category', '${c.key}')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${cat === c.key ? 'bg-royal-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">${c.icon} ${escapeHtml(c.label)}</button>
                        `).join('')}
                    </div>
                </div>

                ${categories.map(c => {
                    const group = filtered.filter(s => s.roleCategory === c.key);
                    if (cat !== 'all' && cat !== c.key) return '';
                    if (group.length === 0 && q) return '';
                    return `
                    <div class="mb-10">
                        <h2 class="text-lg sm:text-xl font-extrabold text-royal-900 mb-4 flex items-center gap-2">
                            <span>${c.icon}</span>
                            <span>${escapeHtml(c.label)}</span>
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${c.badge}">${group.length}</span>
                        </h2>
                        ${group.length === 0 ? `<p class="text-sm text-slate-500">${escapeHtml(t('no_results_found'))}</p>` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${group.map(s => `
                                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition flex items-start gap-4">
                                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-royal-900 to-royal-700 text-gold-400 font-extrabold text-lg flex items-center justify-center shrink-0">
                                        ${escapeHtml((s.fullName || '?').trim().charAt(0))}
                                    </div>
                                    <div class="min-w-0 flex-1">
                                        <h3 class="font-bold text-slate-900 text-sm sm:text-base leading-snug">${escapeHtml(s.fullName)}</h3>
                                        <div class="text-xs font-bold text-royal-700 mt-0.5">${escapeHtml(s.position)}</div>
                                        <div class="flex flex-wrap gap-1.5 mt-2.5">
                                            ${s.subjectOrDept ? `<span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700">${escapeHtml(s.subjectOrDept)}</span>` : ''}
                                            ${s.gradeRange ? `<span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-lg bg-amber-50 text-amber-800">${escapeHtml(s.gradeRange)}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>`}
                    </div>`;
                }).join('')}
            </div>`;
        }

        window.updateStaffFilter = (key, val) => {
            state.staffFilter[key] = val;
            renderCurrentView();
        };

        function getNoticeBadge(cat) {
            const map = {
                exam: { label: t('notice_exam'), cls: 'bg-blue-100 text-blue-800' },
                meeting: { label: t('notice_meeting'), cls: 'bg-purple-100 text-purple-800' },
                registration: { label: t('notice_registration'), cls: 'bg-emerald-100 text-emerald-800' },
                urgent: { label: t('notice_urgent'), cls: 'bg-red-100 text-red-700' },
                general: { label: t('notice_general'), cls: 'bg-slate-100 text-slate-700' }
            };
            return map[cat] || map.general;
        }

        function renderNoticeCard(n) {
            const badge = getNoticeBadge(n.category);
            const title = (state.lang === 'en' && n.titleEn) ? n.titleEn : n.title;
            const content = (state.lang === 'en' && n.contentEn) ? n.contentEn : n.content;
            return `
            <article class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${badge.cls}">${escapeHtml(badge.label)}</span>
                        <span class="text-xs font-medium text-slate-400">📅 ${escapeHtml(n.date || '')}</span>
                    </div>
                    <h3 class="font-extrabold text-slate-900 text-base leading-snug">${escapeHtml(title)}</h3>
                    <p class="text-sm text-slate-600 mt-2.5 leading-relaxed whitespace-pre-line">${escapeHtml(content)}</p>
                </div>
            </article>`;
        }

        function renderNoticesView() {
            const q = state.noticeFilter.search.trim().toLowerCase();
            const cat = state.noticeFilter.category;
            const list = state.notices.filter(n => {
                const matchCat = cat === 'all' || n.category === cat;
                const matchQ = !q ||
                    (n.title || '').toLowerCase().includes(q) ||
                    (n.titleEn || '').toLowerCase().includes(q) ||
                    (n.content || '').toLowerCase().includes(q);
                return matchCat && matchQ;
            });

            return `
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 fade-in">
                <div class="mb-6">
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-royal-900">${escapeHtml(t('notices_title'))}</h1>
                    <p class="text-slate-600 text-sm mt-1">${escapeHtml(t('notices_subtitle'))}</p>

                contact: fd.get('contact').trim(),
                subject: fd.get('subject').trim(),
                message: fd.get('message').trim(),
                read: false,
                createdAt: Date.now()
            };
            await dbSave('messages', null, payload);
            e.target.reset();
            showToast(t('msg_sent_success'), 'success');
        };

        window.quickFillStudent = (u, c, sem) => {
            const form = document.querySelector('#app-main form');
            if (!form) return;
            form.username.value = u;
            form.secretCode.value = c;
            form.semester.value = String(sem);
        };

        window.resetResultLookup = () => {
            state.resultLookup = { student: null, locked: false, lockedGrade: null, lockedSemester: null, error: '' };
            renderCurrentView();
        };

        window.handleStudentResultLogin = (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const username = fd.get('username').trim().toLowerCase();
            const secretCode = fd.get('secretCode').trim();
            const semester = Number(fd.get('semester'));

            const match = state.students.find(
                s => String(s.username).toLowerCase() === username &&
                     String(s.secretCode) === secretCode &&
                     Number(s.semester) === semester
            );

            if (!match) {
                state.resultLookup = { student: null, locked: false, lockedGrade: null, lockedSemester: null, error: t('err_invalid_student') };
                renderCurrentView();
                return;
            }

            const gradeCfg = state.publishSettings[String(match.grade)] || {};
            const isPublished = Boolean(gradeCfg[String(semester)]);

            if (!isPublished) {
                state.resultLookup = {
                    student: null,
                    locked: true,
                    lockedGrade: match.grade,
                    lockedSemester: semester,
                    error: ''
                };
                renderCurrentView();
                return;
            }

            state.resultLookup = { student: match, locked: false, lockedGrade: null, lockedSemester: null, error: '' };
            renderCurrentView();
        };

            e.preventDefault();

            const p = fd.get('password').trim();
            if (u === state.adminAccounts.principal.username.toLowerCase() && p === state.adminAccounts.principal.password) {

                state.adminSession = { role: 'viceprincipal', username: state.adminAccounts.viceprincipal.username, roleAm: 'ምክትል ርዕሰ መምህር (Vice Principal)', roleEn: 'Vice Principal' };

                renderCurrentView();
            } else {
                const teacher = state.teachers.find(
                    tc => String(tc.username).toLowerCase() === u && String(tc.password) === p

                if (teacher) {
                    state.adminSession = {
                        role: 'teacher',

        window.toggleGradePublish = async (grade, sem, val) => {
            const updated = JSON.parse(JSON.stringify(state.publishSettings));
            if (!updated[String(grade)]) updated[String(grade)] = { "1": false, "2": false };
            updated[String(grade)][String(sem)] = Boolean(val);
            await dbSaveConfig('publishSettings', updated);
            showToast(t('saved_success'), 'success');
        };

        window.setAllGradesPublish = async (sem, val) => {
            const updated = JSON.parse(JSON.stringify(state.publishSettings));
            GRADES_LIST.forEach(g => {
                if (!updated[String(g)]) updated[String(g)] = { "1": false, "2": false };
                updated[String(g)][String(sem)] = Boolean(val);
            });
            await dbSaveConfig('publishSettings', updated);
            showToast(t('saved_success'), 'success');
        };

        function renderAdminStudentsTab() {
            const f = state.adminStudentFilter;
            const q = f.search.trim().toLowerCase();
            const filtered = state.students.filter(s => {
                const mQ = !q || (s.fullName || '').toLowerCase().includes(q) || (s.username || '').toLowerCase().includes(q);
                const mG = f.grade === 'all' || Number(s.grade) === Number(f.grade);
                const mSec = f.section === 'all' || String(s.section).toUpperCase() === f.section;
                const mSem = f.semester === 'all' || Number(s.semester) === Number(f.semester);
                return mQ && mG && mSec && mSem;

        window.saveStudentForm = async (e, oldId) => {

            const username = fd.get('username').trim().toLowerCase();
            const semester = Number(fd.get('semester'));
            const scores = {};
            let total = 0;
            SUBJECT_KEYS.forEach(k => {
                const v = Math.max(0, Math.min(100, Number(fd.get('sub_' + k) || 0)));
                scores[k] = v;
                total += v;
            });
            const average = Number((total / SUBJECT_KEYS.length).toFixed(1));
            const docId = `${username}_sem${semester}`;
            const record = {
                id: docId,
                fullName: fd.get('fullName').trim(),
                username,
                secretCode: fd.get('secretCode').trim(),
                grade: Number(fd.get('grade')),
                section: fd.get('section').trim().toUpperCase(),
                semester,
                scores,
                total,
                average,
                status: average >= 50 ? 'Pass' : 'Fail',
                updatedAt: Date.now()
            };
            if (oldId && oldId !== docId) {
                await dbDelete('students', oldId);
            }
            await dbSave('students', docId, record);
            closeAdminModal();
            showToast(t('saved_success'), 'success');
        };

        window.handleStudentExcelImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(buf);
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);
                let count = 0;

                for (const raw of rows) {
                    const get = (keys) => {
                        for (const k of Object.keys(raw)) {
                            if (keys.includes(k.trim().toLowerCase())) return raw[k];
                        }
                        return undefined;
                    };
                    const fullName = String(get(['fullname', 'full name', 'name', 'ስም']) || '').trim();
                    const username = String(get(['username', 'user', 'id']) || '').trim().toLowerCase();
                    const secretCode = String(get(['secretcode', 'secret code', 'code', 'pin']) || '1234').trim();
                    const grade = Number(get(['grade', 'class', 'ክፍል']) || 9);
                    const section = String(get(['section', 'sec', 'ሴክሽን']) || 'A').trim().toUpperCase();
                    const semester = Number(get(['semester', 'sem', 'ሴሚስተር']) || 1);

                    if (!fullName || !username) continue;

                    const scores = {
                        amharic: Number(get(['amharic']) || 0),
                        english: Number(get(['english']) || 0),
                        math: Number(get(['math', 'mathematics']) || 0),
                        physics: Number(get(['physics']) || 0),
                        chemistry: Number(get(['chemistry']) || 0),
                        biology: Number(get(['biology']) || 0),
                        civics: Number(get(['civics', 'citizenship']) || 0),
                        ict: Number(get(['ict']) || 0)
                    };
                    const total = Object.values(scores).reduce((a, b) => a + b, 0);
                    const average = Number((total / SUBJECT_KEYS.length).toFixed(1));
                    const docId = `${username}_sem${semester}`;
                    await dbSave('students', docId, {
                        id: docId, fullName, username, secretCode, grade, section, semester,
                        scores, total, average, status: average >= 50 ? 'Pass' : 'Fail', updatedAt: Date.now()

        };

        window.saveResourceForm = async (e) => {

            let fileUrl = fd.get('fileUrl').trim();
            let fileName = fd.get('title').trim();
            let isImage = fd.get('type') === 'photo';

            if (file && file.size > 0) {
                fileName = file.name;
                if (file.type.startsWith('image/')) {
                    fileUrl = await compressImageFile(file, 900, 0.72);
                    isImage = true;
                } else if (file.size <= 450 * 1024) {
                    fileUrl = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = () => res(r.result);
                        r.onerror = rej;
                        r.readAsDataURL(file);
                    });

            const confirmPass = fd.get('confirmPassword');
            const otherKey = sess.role === 'principal' ? 'viceprincipal' : 'principal';
            const other = state.adminAccounts[otherKey];

            if (current !== acc.password) return fail('የአሁኑ የይለፍ ቃል የተሳሳተ ነው!', 'Current password is incorrect!');
            if (!/^[A-Za-z0-9_.-]{3,30}$/.test(newUser)) return fail('ስሙ 3-30 ፊደል/ቁጥር (ያለ ክፍተት) መሆን አለበት!', 'Username must be 3–30 letters/numbers (no spaces)!');
            if (newUser.toLowerCase() === other.username.toLowerCase()) return fail('ይህ ስም በሌላ አድሚን ተይዟል!', 'That username is already used by the other admin!');
            if (newPass && newPass.length < 6) return fail('አዲሱ የይለፍ ቃል ቢያንስ 6 ቁምፊ መሆን አለበት!', 'New password must be at least 6 characters!');
            if (newPass && newPass !== confirmPass) return fail('አዲሶቹ የይለፍ ቃሎች አይመሳሰሉም!', 'New passwords do not match!');

            const updated = { username: newUser, password: newPass || acc.password };
            state.adminAccounts[sess.role] = updated;
            sess.username = newUser;
            await dbSaveConfig('adminAccounts', { [sess.role]: updated });
            e.target.reset();
            renderCurrentView();
            showToast(am ? 'የአድሚን አካውንት ተቀይሯል! በሚቀጥለው መግቢያ አዲሱን ይጠቀሙ።' : 'Admin account updated! Use the new details next time you sign in.', 'success');
        };

        window.removeBrandImage = async (key) => {
            await dbSaveConfig('schoolSettings', { [key]: '' });
            showToast(t('saved_success'), 'success');
        };

        window.confirmDeleteRecord = (colName, id) => {
            showConfirmModal(t('confirm_delete_title'), t('confirm_delete_msg'), async () => {
                await dbDelete(colName, id);
                showToast(t('deleted_success'), 'info');
            });
        };

        window.state = state;
        window.renderCurrentView = renderCurrentView;
// --- 1. MANAGE TEACHERS TAB (PRINCIPAL) ---
        function renderAdminTeachersTab() {
            return `
            <div>
                <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                    <h2 class="text-xl font-extrabold text-royal-900">👩‍🏫 የመምህራን አካውንቶች (${state.teachers.length})</h2>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="downloadTeacherExcelTemplate()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs px-3.5 py-2.5 rounded-xl">📄 ናሙና Excel አውርድ</button>
                        <label class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl cursor-pointer inline-flex items-center gap-1">
                            📤 90+ መምህራን በExcel ጫን
                            <input type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleTeacherExcelImport(event)" />
                        </label>
                        <button onclick="openTeacherFormModal()" class="bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs px-4 py-2.5 rounded-xl">➕ አዲስ መምህር ጨምር</button>
                    </div>
                </div>
                <div class="overflow-x-auto rounded-2xl border border-slate-200">
                    <table class="w-full text-xs sm:text-sm text-left">
                        <thead class="bg-slate-100 text-slate-700 font-bold">
                            <tr>
                                <th class="py-3 px-3">ሙሉ ስም</th>
                                <th class="py-3 px-3">Username / Password</th>
                                <th class="py-3 px-3">ክፍል & ሴክሽን</th>
                                <th class="py-3 px-3">የትምህርት ዓይነት</th>
                                <th class="py-3 px-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                            ${state.teachers.map(tc => `
                                <tr class="hover:bg-slate-50">
                                    <td class="py-3 px-3 font-bold">${escapeHtml(tc.fullName)}</td>
                                    <td class="py-3 px-3"><code class="bg-slate-100 px-1.5 py-0.5 rounded text-royal-800 font-bold">${escapeHtml(tc.username)}</code> / <code class="bg-amber-50 px-1.5 py-0.5 rounded">${escapeHtml(tc.password)}</code></td>
                                    <td class="py-3 px-3 font-semibold">${tc.assignedGrade}-${escapeHtml(tc.assignedSection)}</td>
                                    <td class="py-3 px-3">${escapeHtml(t('sub_' + tc.assignedSubject))}</td>
                                    <td class="py-3 px-3 text-right">
                                        <button onclick="confirmDeleteRecord('teachers','${escapeHtml(tc.id)}')" class="text-red-600 hover:underline font-bold">${escapeHtml(t('btn_delete'))}</button>
                                    </td>
                                </tr>
                            `).join('') || `<tr><td colspan="5" class="py-8 text-center text-slate-500">ምንም መምህር አልተመዘገበም።</td></tr>`}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        window.openTeacherFormModal = () => {
            openAdminModal('አዲስ መምህር ጨምር', `
                <form onsubmit="saveTeacherForm(event)" class="space-y-4 text-sm">
                    <div><label class="block text-xs font-bold mb-1">ሙሉ ስም *</label><input name="fullName" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold mb-1">Username *</label><input name="username" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>
                        <div><label class="block text-xs font-bold mb-1">Password *</label><input name="password" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="block text-xs font-bold mb-1">ክፍል</label>
                            <select name="assignedGrade" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white">${GRADES_LIST.map(g => `<option value="${g}">${g}</option>`).join('')}</select>
                        </div>
                        <div><label class="block text-xs font-bold mb-1">ሴክሽን</label><input name="assignedSection" required value="A" class="w-full px-3 py-2 rounded-xl border border-slate-300 uppercase" /></div>
                        <div><label class="block text-xs font-bold mb-1">ትምህርት</label>
                            <select name="assignedSubject" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white">${SUBJECT_KEYS.map(k => `<option value="${k}">${escapeHtml(t('sub_' + k))}</option>`).join('')}</select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-3">
                        <button type="button" onclick="closeAdminModal()" class="px-4 py-2 rounded-xl border font-bold text-xs">ሰርዝ</button>
                        <button type="submit" class="px-5 py-2 rounded-xl bg-royal-900 text-white font-bold text-xs">አስቀምጥ</button>
                    </div>
                </form>
            `);
        };

        window.saveTeacherForm = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const username = fd.get('username').trim().toLowerCase();
            await dbSave('teachers', username, {
                fullName: fd.get('fullName').trim(),
                username,
                password: fd.get('password').trim(),
                assignedGrade: Number(fd.get('assignedGrade')),
                assignedSection: fd.get('assignedSection').trim().toUpperCase(),
                assignedSubject: fd.get('assignedSubject')
            });
            closeAdminModal();
            showToast(t('saved_success'), 'success');
        };

        window.downloadTeacherExcelTemplate = () => {
            const ws = XLSX.utils.json_to_sheet([{ FullName: "መ/ር አበበ", Username: "abebe_phy", Password: "123456", Grade: 11, Section: "B", Subject: "physics" }]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Teachers");
            XLSX.writeFile(wb, "Motta_Teachers_Template.xlsx");
        };

        window.handleTeacherExcelImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const wb = XLSX.read(await file.arrayBuffer());
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            let count = 0;
            for (const r of rows) {
                const username = String(r.Username || '').trim().toLowerCase();
                if (!username) continue;
                await dbSave('teachers', username, {
                    fullName: String(r.FullName || username).trim(),
                    username,
                    password: String(r.Password || '123456').trim(),
                    assignedGrade: Number(r.Grade || 11),
                    assignedSection: String(r.Section || 'A').trim().toUpperCase(),
                    assignedSubject: String(r.Subject || 'math').trim().toLowerCase()
                });
                count++;
            }
            showToast(`${count} መምህራን ተመዝግበዋል!`, 'success');
            e.target.value = '';
        };

        // --- 2. TEACHER PORTAL TAB (SUBMIT SCORES) ---
        function renderTeacherPortalTab() {
            const tc = state.adminSession;
            const sem = Number(state.teacherSem || 1);
            const myStudents = state.students.filter(s =>
                Number(s.grade) === Number(tc.assignedGrade) &&
                String(s.section).toUpperCase() === String(tc.assignedSection).toUpperCase() &&
                Number(s.semester) === sem
            );
            const mySubs = state.submissions.filter(sub => sub.teacherUsername === tc.username);

            return `
            <div>
                <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                    <div>
                        <h2 class="text-xl font-extrabold text-royal-900">📝 ውጤት ማስገቢያ (${tc.assignedGrade}-${tc.assignedSection} • ${escapeHtml(t('sub_' + tc.assignedSubject))})</h2>
                        <p class="text-xs text-slate-500 mt-0.5">ውጤቱን ሞልተው ሲልኩ ርዕሰ መምህሩ Accept እስኪሉ ድረስ Pending ይሆናል።</p>
                    </div>
                    <select onchange="state.teacherSem=this.value; renderCurrentView();" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-bold bg-white">
                        <option value="1" ${sem===1?'selected':''}>1ኛ ሴሚስተር</option>
                        <option value="2" ${sem===2?'selected':''}>2ኛ ሴሚስተር</option>
                    </select>
                </div>

                <form onsubmit="submitTeacherScores(event)" class="space-y-4">
                    <div class="overflow-x-auto rounded-2xl border border-slate-200">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-royal-900 text-white">
                                <tr><th class="py-3 px-4">የተማሪ ስም</th><th class="py-3 px-4">Username</th><th class="py-3 px-4 w-36">ውጤት (ከ100)</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                ${myStudents.map(s => `
                                    <tr>
                                        <td class="py-2.5 px-4 font-bold">${escapeHtml(s.fullName)}</td>
                                        <td class="py-2.5 px-4 text-slate-500">${escapeHtml(s.username)}</td>
                                        <td class="py-2.5 px-4"><input type="number" min="0" max="100" required name="score_${escapeHtml(s.id)}" value="${Number(s.scores?.[tc.assignedSubject] || 0)}" class="w-24 px-3 py-1.5 rounded-lg border border-slate-300 font-bold" /></td>
                                    </tr>
                                `).join('') || `<tr><td colspan="3" class="py-6 text-center text-slate-500">በዚህ ክፍል እና ሴሚስተር ተማሪ አልተገኘም።</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                    ${myStudents.length ? `<button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-6 py-3 rounded-xl text-sm">📤 ለርዕሰ መምህር ላክ (Submit)</button>` : ''}
                </form>

                <h3 class="font-extrabold text-royal-900 mt-8 mb-3">የላኳቸው ውጤቶች ሁኔታ</h3>
                <div class="space-y-2">
                    ${mySubs.map(sub => `
                        <div class="p-3.5 rounded-xl border flex justify-between items-center text-xs sm:text-sm bg-slate-50">
                            <span><b>${sub.grade}-${sub.section}</b> (Sem ${sub.semester}) • ${sub.entries.length} ተማሪዎች</span>
                            <span class="px-2.5 py-1 rounded-lg font-bold ${sub.status==='approved'?'bg-emerald-100 text-emerald-800':sub.status==='rejected'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-800'}">
                                ${sub.status==='approved'?'✅ ጸድቋል (Accepted)':sub.status==='rejected'?'❌ ተመልሷል (Rejected)':'⏳ ፈቃድ በመጠባበቅ ላይ (Pending)'}
                            </span>
                        </div>
                    `).join('') || '<p class="text-xs text-slate-400">ገና ምንም አልላኩም።</p>'}
                </div>
            </div>`;
        }

        window.submitTeacherScores = async (e) => {
            e.preventDefault();
            const tc = state.adminSession;
            const sem = Number(state.teacherSem || 1);
            const fd = new FormData(e.target);
            const entries = [];
            for (const [k, v] of fd.entries()) {
                if (k.startsWith('score_')) {
                    const studentId = k.replace('score_', '');
                    const st = state.students.find(x => x.id === studentId);
                    if (st) entries.push({ studentId, fullName: st.fullName, username: st.username, score: Number(v) });
                }
            }
            await dbSave('submissions', null, {
                teacherName: tc.fullName,
                teacherUsername: tc.username,
                grade: tc.assignedGrade,
                section: tc.assignedSection,
                subject: tc.assignedSubject,
                semester: sem,
                status: 'pending',
                entries,
                submittedAt: Date.now()
            });
            showToast('ውጤቱ ለርዕሰ መምህሩ ተልኳል!', 'success');
        };

        // --- 3. PRINCIPAL APPROVALS TAB (READ-ONLY + ACCEPT/REJECT) ---
        function renderAdminApprovalsTab() {
            const pending = state.submissions.filter(s => s.status === 'pending');
            return `
            <div>
                <h2 class="text-xl font-extrabold text-royal-900 mb-1">✅ ከመምህራን የተላኩ ውጤቶች (${pending.length} ፈቃድ የሚጠብቁ)</h2>
                <p class="text-xs text-slate-500 mb-5">ውጤቱን አረጋግጠው Accept ወይም Reject ማለት ብቻ ይችላሉ (ውጤት መቀየር አይቻልም)።</p>
                <div class="space-y-4">
                    ${state.submissions.map(sub => `
                        <div class="p-5 rounded-2xl border ${sub.status==='pending'?'border-amber-300 bg-amber-50/40':'border-slate-200 bg-white'}">
                            <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
                                <div>
                                    <div class="font-extrabold text-royal-900">${escapeHtml(sub.teacherName)} — ክፍል ${sub.grade}-${escapeHtml(sub.section)} (${escapeHtml(t('sub_' + sub.subject))} • Sem ${sub.semester})</div>
                                    <div class="text-xs text-slate-500">${sub.entries.length} ተማሪዎች</div>
                                </div>
                                ${sub.status === 'pending' ? `
                                    <div class="flex gap-2">
                                        <button onclick="approveSubmission('${escapeHtml(sub.id)}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs">✅ Accept (አጽድቅ)</button>
                                        <button onclick="rejectSubmission('${escapeHtml(sub.id)}')" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl text-xs">❌ Reject (መልስ)</button>
                                    </div>
                                ` : `<span class="text-xs font-bold px-3 py-1 rounded-lg ${sub.status==='approved'?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-700'}">${sub.status==='approved'?'✅ Accepted':'❌ Rejected'}</span>`}
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                                ${sub.entries.map(en => `<div class="bg-white p-2 rounded-lg border flex justify-between"><span class="truncate pr-2">${escapeHtml(en.fullName)}</span><b class="text-royal-900">${en.score}</b></div>`).join('')}
                            </div>
                        </div>
                    `).join('') || '<p class="text-center text-slate-500 py-8 text-sm">ከመምህራን የተላከ ውጤት የለም።</p>'}
                </div>
            </div>`;
        }

        window.approveSubmission = async (subId) => {
            const sub = state.submissions.find(x => x.id === subId);
            if (!sub) return;
            for (const en of sub.entries) {
                const st = state.students.find(x => x.id === en.studentId);
                if (!st) continue;
                const scores = { ...(st.scores || {}), [sub.subject]: Number(en.score) };
                const total = SUBJECT_KEYS.reduce((a, k) => a + Number(scores[k] || 0), 0);
                const average = Number((total / SUBJECT_KEYS.length).toFixed(1));
                await dbSave('students', st.id, { ...st, scores, total, average, status: average >= 50 ? 'Pass' : 'Fail', updatedAt: Date.now() });
            }
            await dbSave('submissions', subId, { ...sub, status: 'approved', approvedAt: Date.now() });
            showToast('ውጤቱ ጸድቆ ወደ ተማሪዎች ዳታቤዝ ገብቷል!', 'success');
        };

        window.rejectSubmission = async (subId) => {
            const sub = state.submissions.find(x => x.id === subId);
            if (!sub) return;
            await dbSave('submissions', subId, { ...sub, status: 'rejected' });
            showToast('ውጤቱ ወደ መምህሩ ተመልሷል።', 'info');
        };
        // 11. BOOTSTRAP
        updateChromeInfo();
        initFirebaseOrLocal();
    </script>
</body>
</html>
